[package]
name = "oxidize-chat"
edition = "2021"
publish = false

[features]
scripting = ["rune", "rune-modules", "ignore", "db/scripting"]

[dependencies]
db = { workspace = true }
common = { workspace = true }
emotes = { workspace = true }
api = { workspace = true }
auth = { workspace = true }
settings = { workspace = true }
bus = { workspace = true }
messagelog = { workspace = true }
currency = { workspace = true }
storage = { workspace = true }
async-trait = "0.1.68"
notify = "8"
rune = { version = "0.14.2", optional = true }
rune-modules = { version = "0.14.2", features = ["full"], optional = true }
ignore = { version = "0.4.20", optional = true }
async-injector = { workspace = true }
url = "2.3.1"
tracing = { workspace = true }
irc = { version = "1.0.0", default-features = false, features = ["tls-native"] }
anyhow = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["time"] }
parking_lot = { workspace = true }
slab = "0.4.8"
smallvec = { workspace = true }
leaky-bucket = "1.1.2"
async-fuse = { version = "1.0.1", features = ["stream03"] }
thiserror = { workspace = true }
async-stream = "0.3.5"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde_cbor = "0.11.2"
