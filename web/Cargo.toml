[package]
name = "web"
version = "0.0.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2021"
rust-version = "1.95"
description = "The web component of OxidizeBot, a high performance Twitch Bot powered by Rust."
documentation = "https://docs.rs/oxidize"
readme = "README.md"
homepage = "https://github.com/udoprog/OxidizeBot"
repository = "https://github.com/udoprog/OxidizeBot"
license = "MIT OR Apache-2.0"
keywords = ["twitch"]
categories = ["bots"]

[dependencies]
anyhow = { workspace = true }
async-oauth2 = "0.6.0"
base64 = "0.23.1"
bytes = "1.4.0"
chrono = { workspace = true }
clap = { version = "4.2.2", features = ["derive"] }
cookie = { version = "0.18.2", features = ["percent-encode"] }
hyper = { version = "0.14.26", features = ["server", "http1", "stream", "tcp"] }
mime = "0.3.17"
mime_guess = "2.0.4"
parking_lot = { workspace = true }
relative-path = { version = "2.0.3", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy"] }
ring = "0.17.8"
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path"] }
serde = { workspace = true }
serde_cbor = "0.11.2"
serde_json = { workspace = true }
serde_urlencoded = "0.7.1"
sled34 = { package = "sled", version = "0.34.0" }
smallvec = { workspace = true }
thiserror = { workspace = true }
time = "0.3.20"
tokio = { workspace = true, features = ["full", "tracing"] }
tokio-stream = "0.1.12"
toml = "1.1.8"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
url = { workspace = true }
